<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1. třída — LinguaCzech</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--m:#32a0d2;--o:#ffaa37;--z:#16a34a;--font:'Barlow Condensed',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:#f0f7fc;}
.wrap{max-width:680px;margin:0 auto;padding:1.25rem 1rem 3rem;}

.topbar{display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,#1a7fa8,#32a0d2);
  padding:.45rem 1rem;margin-bottom:1rem;border-radius:10px;}
.topbar a{color:white;font-size:.9rem;font-weight:700;cursor:pointer;
  text-decoration:none;display:flex;align-items:center;gap:.35rem;opacity:.92;}
.topbar a:hover{opacity:1;}
.topbar span{color:rgba(255,255,255,.75);font-size:.78rem;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;}

.hdr{background:linear-gradient(135deg,#1a7fa8,var(--m));border-radius:16px;padding:1.5rem;text-align:center;color:white;margin-bottom:1.25rem;}
.hdr h1{font-size:2rem;font-weight:800;}
.hdr p{opacity:.85;font-size:.9rem;margin-top:.2rem;}

.score-card{background:white;border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 10px rgba(50,160,210,.1);text-align:center;}
.score-label{font-size:.78rem;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem;}
.score-big{font-size:4rem;font-weight:800;color:var(--o);line-height:1;}
.trophies{display:flex;justify-content:center;gap:2rem;margin-top:1rem;}
.tph{text-align:center;}
.tph-icon{font-size:2rem;transition:opacity .4s,filter .4s;}
.tph-bar{width:56px;height:5px;background:#e5e7eb;border-radius:99px;margin:.3rem auto 0;overflow:hidden;}
.tph-fill{height:5px;border-radius:99px;transition:width .6s;}
.tph-val{font-size:.7rem;color:#9ca3af;font-weight:700;margin-top:.25rem;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.lnk{display:block;padding:1rem .75rem;border-radius:99px;text-decoration:none;text-align:center;font-weight:800;font-size:1rem;color:#1e3a4f;background:white;border:2px solid #d1d5db;transition:all .12s;}
.lnk:hover{border-color:var(--m);color:var(--m);transform:translateY(-2px);}
.lnk small{display:block;font-size:.72rem;font-weight:600;color:#6b7280;margin-top:.15rem;}

.reset-btn{display:block;margin:1.5rem auto 0;background:none;border:1.5px solid #d1d5db;border-radius:8px;padding:.4rem 1rem;font-size:.8rem;color:#9ca3af;cursor:pointer;font-family:var(--font);}
.reset-btn:hover{border-color:#ef4444;color:#ef4444;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="index.html">← Úvod</a><span>LinguaCzech</span></div>

  <div class="hdr">
    <h1>🌱 1. třída</h1>
    <p>LinguaCzech · přehled bodů</p>
  </div>

  <div class="score-card">
    <div class="score-label">Celkové body</div>
    <div class="score-big" id="total">0</div>
    <div class="trophies">
      <div class="tph"><div class="tph-icon" id="tp1">🥉</div><div class="tph-bar"><div class="tph-fill" id="tb1" style="background:#cd7f32;width:0%"></div></div><div class="tph-val">100 b.</div></div>
      <div class="tph"><div class="tph-icon" id="tp2">🥈</div><div class="tph-bar"><div class="tph-fill" id="tb2" style="background:#a8a9ad;width:0%"></div></div><div class="tph-val">300 b.</div></div>
      <div class="tph"><div class="tph-icon" id="tp3">🥇</div><div class="tph-bar"><div class="tph-fill" id="tb3" style="background:#fbbf24;width:0%"></div></div><div class="tph-val">600 b.</div></div>
    </div>
  </div>

  <div class="grid">
    <a class="lnk" href="pismena.html" style="grid-column:span 2">Písmena<small>velká · malá · psací · první hláska · auto</small></a>
    <a class="lnk" href="cteni.html" style="grid-column:span 2">Čtení<small>krátká slova · dlouhá slova · věty · porozumění</small></a>
  </div>

  <button class="reset-btn" onclick="if(confirm('Vymazat všechny body 1. třídy?'))resetAll()">Vymazat body</button>
</div>

<script>
var KEYS=['pismena_score','cteni_score'];
function load(){
  var t=0;
  KEYS.forEach(function(k){try{t+=parseInt(localStorage.getItem(k))||0;}catch(e){}});
  document.getElementById('total').textContent=t;
  var thresholds=[100,300,600];
  [['tp1','tb1'],['tp2','tb2'],['tp3','tb3']].forEach(function(x,i){
    var p=Math.min(1,t/thresholds[i]);
    var ico=document.getElementById(x[0]);
    ico.style.opacity=(0.14+p*0.86).toFixed(2);
    ico.style.filter=p>=1?'none':'grayscale('+(1-p).toFixed(2)+')';
    document.getElementById(x[1]).style.width=(p*100).toFixed(0)+'%';
  });
}
function resetAll(){
  KEYS.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});load();
}
load();
</script>
</body>
</html>
