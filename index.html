<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingua Universal — Cvičení</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{--m:#32a0d2;--o:#ffaa37;--z:#16a34a;--font:'Barlow Condensed',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:#f0f7fc;min-height:100vh;overflow-x:hidden;}

/* HERO */
.hero{background:linear-gradient(160deg,#0e6fa3 0%,var(--m) 50%,#5bc8ec 100%);padding:2.5rem 1rem 0;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.08) 0%,transparent 60%);}
.school-badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:99px;padding:.35rem 1rem;margin-bottom:1rem;position:relative;}
.school-dot{width:9px;height:9px;background:var(--o);border-radius:50%;}
.school-name{font-size:1rem;font-weight:800;color:white;letter-spacing:.5px;}
.hero h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;color:white;line-height:1.05;margin-bottom:.5rem;position:relative;}
.hero h1 em{color:var(--o);font-style:normal;}
.hero p{color:rgba(255,255,255,.88);font-size:1rem;font-weight:600;margin-bottom:1.5rem;position:relative;}

/* SVG scene */
.hero-scene{max-width:500px;margin:0 auto;animation:rise .7s ease both;}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.hero-scene svg{width:100%;height:auto;display:block;}

/* Wave */
.wave{display:block;background:#f0f7fc;}

/* MAIN */
.main{max-width:680px;margin:0 auto;padding:1.25rem 1rem 3rem;}
.sec-label{font-size:1.4rem;font-weight:800;color:#1e4a6b;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem;}
.sec-label::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,#c7e8f7,transparent);border-radius:2px;}

/* Grade grid */
.grade-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin-bottom:1.75rem;}
@media(max-width:480px){.grade-grid{grid-template-columns:1fr 1fr;}}

.gc{border-radius:14px;padding:1rem .5rem;text-align:center;cursor:pointer;border:none;font-family:var(--font);transition:transform .15s,box-shadow .15s;outline:none;}
.gc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.18);}
.gc.active{box-shadow:0 4px 16px rgba(0,0,0,.2);}
.gc.m{background:var(--m);}
.gc.o{background:var(--o);}
.gc-num{font-size:2rem;font-weight:800;color:white;line-height:1;}
.gc-lbl{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.9);margin-top:.2rem;text-transform:uppercase;letter-spacing:.04em;}
.gc-tag{display:inline-block;background:rgba(255,255,255,.25);font-size:.6rem;font-weight:800;color:white;border-radius:99px;padding:.1rem .45rem;margin-top:.3rem;}

/* Lessons */
.lessons{display:none;flex-direction:column;gap:.7rem;animation:fade .25s ease;}
.lessons.vis{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.lk{display:flex;align-items:center;gap:.85rem;background:white;border-radius:12px;padding:.9rem 1rem;text-decoration:none;color:inherit;border-left:4px solid var(--m);box-shadow:0 1px 6px rgba(0,0,0,.07);transition:transform .12s,box-shadow .12s;}
.lk:hover{transform:translateX(3px);box-shadow:0 3px 12px rgba(0,0,0,.11);}
.lk.o{border-left-color:var(--o);}
.lk.g{border-left-color:var(--z);}
.lk.dim{opacity:.52;pointer-events:none;}
.lk-ico{font-size:1.5rem;width:36px;text-align:center;flex-shrink:0;}
.lk-body{flex:1;}
.lk-title{font-size:1rem;font-weight:800;color:#1e3a4f;}
.lk-desc{font-size:.78rem;color:#6b7280;margin-top:.1rem;}
.coming{font-size:.65rem;background:#f3f4f6;color:#9ca3af;border-radius:99px;padding:.1rem .45rem;font-weight:700;margin-left:.4rem;}
.lk-arr{color:#b0cfe0;font-size:1.1rem;flex-shrink:0;}
.lk.o .lk-arr{color:var(--o);}
</style>
</head>

<script>
/* == NASTAVENÍ URL == 
   Sem vlož správnou URL adresu stránky 2. třídy z tvého portálu.
   Příklad: '2trida.html'
   nebo jen název stránky pokud jsou ve stejné složce: 'index.html'
*/
var DRUHA_TRIDA_URL = '2trida.html';

function showGrade(g){
  if(g===2){window.location=DRUHA_TRIDA_URL;return;}
  document.querySelectorAll('.gc').forEach(function(b,i){
    b.classList.toggle('active',i+1===g);
  });
}
</script>
