<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doplň sloveso ke zvířeti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#32a0d2;--orange:#ffaa37;--green:#4caf50;--red:#e5534b;--ink:#2b3a44;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Barlow Condensed',system-ui,sans-serif;color:var(--ink);background:#f4f8fb;padding:16px;}
.wrap{max-width:760px;margin:0 auto;}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
h1{font-size:34px;font-weight:700;color:var(--blue);margin:0;letter-spacing:.5px;}
.sub{font-size:18px;color:#6b7c86;margin:2px 0 0;}
.score{font-size:22px;font-weight:600;color:var(--orange);white-space:nowrap;}
.bar{height:12px;border-radius:8px;background:#e2ecf2;overflow:hidden;margin:14px 0 6px;}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .4s;}
.milestones{display:flex;justify-content:space-between;font-size:16px;color:#9bb0bd;margin-bottom:18px;}
.milestones .hit{color:var(--orange);font-weight:600;}
.card-q{background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 4px 18px rgba(50,120,180,.10);}
.progress{font-size:18px;color:#8a9aa5;font-weight:500;margin-bottom:10px;}
.sentence{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap;min-height:120px;margin:6px 0 26px;}
.animal img{max-height:96px;}
.verb-slot{font-size:34px;font-weight:700;color:var(--blue);border-bottom:4px solid var(--orange);
           min-width:150px;text-align:center;padding-bottom:2px;line-height:1.1;}
.dot{font-size:34px;font-weight:700;align-self:flex-end;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.opt{background:#fff;border:3px solid #e2ecf2;border-radius:14px;padding:16px 10px;cursor:pointer;
     font-family:inherit;font-size:26px;font-weight:600;color:var(--ink);text-align:center;transition:.15s;}
.opt:hover{border-color:var(--blue);transform:translateY(-2px);}
.opt.correct{border-color:var(--green);background:#eefaf0;color:var(--green);box-shadow:0 0 0 3px rgba(76,175,80,.25);}
.opt.wrong{border-color:var(--red);background:#fdeeee;color:var(--red);animation:shake .35s;}
.opt.locked{pointer-events:none;opacity:.5;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.feedback{text-align:center;font-size:22px;font-weight:600;height:28px;margin:16px 0 4px;}
.feedback.ok{color:var(--green);} .feedback.no{color:var(--red);}
.next{display:block;margin:10px auto 0;background:var(--green);color:#fff;border:none;font-family:inherit;
      font-size:22px;font-weight:600;padding:12px 40px;border-radius:12px;cursor:pointer;visibility:hidden;}
.next:hover{filter:brightness(1.05);}
.done{text-align:center;padding:30px 10px;}
.done h2{font-size:34px;color:var(--blue);margin:0 0 6px;} .done .big{font-size:60px;margin:8px 0;}
.restart{background:var(--blue);color:#fff;border:none;font-family:inherit;font-size:20px;font-weight:600;
         padding:10px 30px;border-radius:12px;cursor:pointer;margin-top:8px;}
@media(max-width:520px){h1{font-size:28px}.animal img{max-height:76px}.verb-slot{font-size:28px;min-width:120px}.opt{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Jak dělá zvíře?</h1>
      <p class="sub">Přečti psací slovo a vyber sloveso, aby věta dávala smysl.</p>
    </div>
    <div class="score">🏆 <span id="score">0</span> b.</div>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="milestones"><span id="m1">🥉 50</span><span id="m2">🥈 100</span><span id="m3">🥇 150</span></div>

  <div id="game" class="card-q">
    <div class="progress">Věta <span id="qnum">1</span> / <span id="qtot">15</span></div>
    <div class="sentence" id="sentence"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="next">Další ➜</button>
  </div>
</div>

const KEYS = Object.keys(DATA.slovesa);
const MAX = KEYS.length * 10;
const store=(()=>{try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>m[k]=String(v)};}})();
const SKEY='zvirata_sloveso_demo';
let order=[], idx=0, score=0, answered=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){order=shuffle(KEYS.map((_,i)=>i));idx=0;score=0;document.getElementById('qtot').textContent=KEYS.length;updateScore();render();}
function updateScore(){
  document.getElementById('score').textContent=score;
  document.getElementById('fill').style.width=Math.min(100,score/MAX*100)+'%';
  document.getElementById('m1').className=score>=50?'hit':'';
  document.getElementById('m2').className=score>=100?'hit':'';
  document.getElementById('m3').className=score>=150?'hit':'';
}
function render(){
  answered=false;
  const animal=KEYS[order[idx]];
  const correct=DATA.slovesa[animal];
  document.getElementById('qnum').textContent=idx+1;
  document.getElementById('sentence').innerHTML=
    '<span class="animal"><img alt="'+DATA.nazev[animal]+'" src="'+DATA.imgs[animal]+'"></span>'+
    '<span class="verb-slot" id="slot">&nbsp;&nbsp;&nbsp;</span><span class="dot">.</span>';
  const otherVerbs=KEYS.map(k=>DATA.slovesa[k]).filter(v=>v!==correct);
  const opts=shuffle([correct,...shuffle(otherVerbs).slice(0,3)]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(v=>{
    const b=document.createElement('button');b.className='opt';b.type='button';b.textContent=v;
    b.onclick=()=>choose(b,v,correct);box.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.textContent='';fb.className='feedback';
  document.getElementById('next').style.visibility='hidden';
}
function choose(el,v,correct){
  if(answered)return;
  const fb=document.getElementById('fb');
  if(v===correct){
    answered=true;el.classList.add('correct');
    [...document.querySelectorAll('.opt')].forEach(o=>{if(o!==el)o.classList.add('locked');});
    document.getElementById('slot').textContent=correct;
    fb.textContent='Správně! 🎉';fb.className='feedback ok';
    score+=10;updateScore();
    const nx=document.getElementById('next');
    nx.textContent=idx<KEYS.length-1?'Další ➜':'Ukončit ✓';nx.style.visibility='visible';
  }else{
    el.classList.add('wrong');fb.textContent='Zkus to znovu 🙂';fb.className='feedback no';
    setTimeout(()=>el.classList.remove('wrong'),400);
  }
}
document.getElementById('next').onclick=()=>{if(idx<KEYS.length-1){idx++;render();}else finish();};
function finish(){
  const best=Math.max(score,parseInt(store.getItem(SKEY)||'0',10));store.setItem(SKEY,best);
  const medal=score>=150?'🥇':score>=100?'🥈':score>=50?'🥉':'⭐';
  document.getElementById('game').innerHTML=
    '<div class="done"><div class="big">'+medal+'</div><h2>Hotovo!</h2>'+
    '<p style="font-size:24px;margin:6px 0">Získal(a) jsi <b style="color:var(--orange)">'+score+'</b> z '+MAX+' bodů.</p>'+
    '<button class="restart" onclick="start()">Hrát znovu</button></div>';
}
start();
</script>
